name: brilliance

services:
  backend:
    restart: unless-stopped
    build:
      context: ./../..
      dockerfile: .configs/docker/Dockerfile
    volumes:
      - ./../../:/app

      - backend_venv:/app/.venv
      - uv_cache:/root/.cache/uv
      - uv_python:/root/.local/share/uv
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
    tmpfs:
      - /tmp
    ports:
      - 8082:8082
    command: uv run uvicorn example.main:app --host 0.0.0.0 --port 8082
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 60s
      start_period: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3

  postgres:
    restart: unless-stopped
    image: postgres:alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 5432 -U "$$POSTGRES_USER"']
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  backend_venv:
  uv_cache:
  uv_python:
