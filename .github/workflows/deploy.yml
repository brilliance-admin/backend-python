name: CI-CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build containers
        run: docker build -t brilliance-backend -f .configs/docker/Dockerfile .

      - name: Run tests
        run: docker compose -f .configs/docker/docker-compose.yml run --rm backend sh -c 'git config --global --add safe.directory /app && uv sync --all-groups --all-extras && uv run pytest -vvv'

      - name: Cleanup
        if: always()
        run: sudo chown -R deploy:deploy $GITHUB_WORKSPACE || true

  deploy:
    needs: build-test
    runs-on: self-hosted
    if: ${{ success() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            sudo apt update
            sudo apt install -y rsync
            mkdir -p /home/deploy/apps/backend-python

      - name: Copy files to server
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -rltvz --delete --exclude-from='.rsyncignore'
          path: .
          remote_path: /home/deploy/apps/backend-python
          remote_host: ${{ vars.SERVER_HOST }}
          remote_user: deploy
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            sudo chown -R deploy:deploy /home/deploy/apps/backend-python
            cd /home/deploy/apps/backend-python
            docker compose -f .configs/docker/docker-compose.yml up -d --build
            sudo ln -sf /home/deploy/apps/backend-python/.configs/nginx/example.conf /etc/nginx/sites-enabled/example
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Wait backend healthy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/apps/backend-python

            CONTAINER="$(docker compose -f .configs/docker/docker-compose.yml ps -q backend)"

            if [ -z "$CONTAINER" ]; then
              echo "Backend container not found"
              docker compose -f .configs/docker/docker-compose.yml ps
              exit 1
            fi

            for i in $(seq 1 30); do
              STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no healthcheck{{end}}' "$CONTAINER" 2>/dev/null || echo 'not found')"
              echo "Attempt $i: status=$STATUS"

              if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "no healthcheck" ]; then
                exit 0
              fi

              if [ "$i" = "30" ]; then
                echo "Container logs:"
                docker logs "$CONTAINER" --tail 100
                exit 1
              fi

              sleep 2
            done
