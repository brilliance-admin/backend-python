name: CI-CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build containers
        run: docker build -t brilliance-backend -f .configs/docker/Dockerfile .

      - name: Run tests
        run: docker compose -f .configs/docker/docker-compose.yml run --rm backend sh -c 'uv sync --all-groups --all-extras && uv run pytest'

      - name: Cleanup
        if: always()
        run: sudo chown -R deploy:deploy $GITHUB_WORKSPACE || true

  deploy:
    needs: build-test
    runs-on: self-hosted
    if: ${{ success() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Clone repo via GitHub App
        uses: GuillaumeFalourd/clone-github-repo-action@v2
        with:
          owner: brilliance-admin
          repository: backend-python
          app_id: ${{ secrets.GH_APP_ID }}
          installation_id: ${{ secrets.GH_APP_INSTALLATION_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Copy files to server
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr --delete --chown=deploy:deploy --exclude='.venv' --exclude='__pycache__' --exclude='.git' --exclude='*.pyc' --exclude='.pytest_cache'
          path: .
          remote_path: /home/deploy/apps/backend-python
          remote_host: ${{ vars.SERVER_HOST }}
          remote_user: deploy
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy and configure
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # Ensure rsync
            if ! command -v rsync >/dev/null 2>&1; then
              sudo apt update && sudo apt install -y rsync
            fi

            # Fix permissions
            sudo chown -R deploy:deploy /home/deploy/apps/backend-python

            # Deploy Docker
            cd /home/deploy/apps/backend-python
            docker compose -f .configs/docker/docker-compose.yml run --rm backend /bin/bash -c "uv sync --all-groups --all-extras"
            docker compose -f .configs/docker/docker-compose.yml up -d --build

            # Wait for healthy
            for i in $(seq 1 10); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' brilliance-backend-1 2>/dev/null || echo "not found")
              echo "Attempt $i: status=$STATUS"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              if [ "$i" = "10" ]; then
                echo "Container logs:"
                docker logs brilliance-backend-1 --tail 50
                exit 1
              fi
              sleep 5
            done

            # Ensure nginx
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt update && sudo apt install -y nginx
            fi

            if ! systemctl is-active --quiet nginx; then
              sudo systemctl start nginx
            fi

            # Update nginx config
            sudo ln -sf /home/deploy/apps/backend-python/.configs/nginx/example.conf /etc/nginx/sites-enabled/example
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx
